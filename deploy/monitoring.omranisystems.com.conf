# monitoring.omranisystems.com  ->  central app on 127.0.0.1:16000
#
# Paste this server block into /etc/nginx/nginx.conf alongside the other
# *.omranisystems.com blocks (TLS uses the existing wildcard cert, same as
# pass./it. — no ssl_certificate lines needed here). Then:
#     nginx -t && systemctl reload nginx
#
# Access model (defense in depth, because monitoring is sensitive):
#   - Dashboard UI + API  -> behind the omranisystems access-code gate
#                            (app "monitoring") AND the app's own password login.
#   - /api/ingest         -> NOT gated: agents authenticate with the shared
#                            ingest token (Bearer) and cannot pass the gate.
#   - /healthz            -> NOT gated: for uptime checks.
#
# Requires registering the gate app code "monitoring" in the omranisystems app
# (e.g. CODE_MONITORING in /projects/omranisystems/.env + its app registry).
# If you'd rather rely ONLY on the app's own login, delete the two gate
# location blocks and the `auth_request` / `error_page` lines below.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.omranisystems.com;

    # --- access-code gate (same pattern as pass.omranisystems.com) ---
    location = /__gate {
        internal;
        proxy_pass http://127.0.0.1:4000/gate/verify?app=monitoring;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @unlock {
        return 302 https://omranisystems.com/unlock?app=monitoring;
    }

    # --- agent ingest: token-authed, NOT gated (agents can't pass the gate) ---
    location = /api/ingest {
        proxy_pass http://127.0.0.1:16000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- health check: ungated ---
    location = /healthz {
        proxy_pass http://127.0.0.1:16000;
    }

    # --- dashboard UI + API: gated, then the app's own login ---
    location / {
        auth_request /__gate;
        error_page 401 = @unlock;
        proxy_pass http://127.0.0.1:16000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Direct IP:port hit -> bounce to the canonical https host (mirrors pass./it.).
server {
    listen 37.60.240.195:16000;
    server_name _;
    return 301 https://monitoring.omranisystems.com$request_uri;
}
