# nginx reverse proxy for the monitor — template.
# install.sh fills __DOMAIN__ and __PORT__ and writes it to
# /etc/nginx/conf.d/<name>.conf. The app binds 127.0.0.1 only; nginx is the
# public door. Auth is the app's own password login.
#
# This is an HTTP (port 80) block. For TLS on a standalone box, after install
# run:   certbot --nginx -d __DOMAIN__
# certbot rewrites this block to listen on 443 with a Let's Encrypt cert.
# (On a box that already terminates TLS — e.g. behind Cloudflare with a
# wildcard cert set at the http{} level — change `listen 80;` to
# `listen 443 ssl http2;` instead and drop the certbot step.)

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
